<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><title>双档案界面回归样例</title>
<link rel="stylesheet" href="/style.css">
<style>body{margin:0;padding:24px;background:#15171e;color:#eee;font:16px system-ui}#extensions_settings2{max-width:980px;margin:auto}button{font:inherit}*{box-sizing:border-box}</style>
<div id="extensions_settings2"></div><div id="chat"></div>
<script type="module">
import {carrierCardSections} from '/core.js';
import {dossierBodyId} from '/dossier.js';
const text=`— 当前形态基础 —
姓名：林晓
年龄：28
种族：人类
职业：画师
— 外貌详述 —
头发：黑色长发，发尾微卷。
面容：自然肤色，左眉有一颗小痣。
妆容：无
— 声音特征 —
音色：清亮
— 气味特征 —
自然体味：淡淡皂香
— 卫生状况 —
全身卫生：干净
— 当前穿着 —
上衣：灰色棉衫
鞋子：黑色短靴
— 人生背景 —
出生与家庭：出生在河畔小城。
成长经历：成年后学习绘画。`;
const body={rawCard:text,text,sections:carrierCardSections(text),profile:{姓名:'林晓',种族:'人类',职业:'画师',年龄:'28'},generation:2,confirmationMessageIndex:-1,confirmed:true,sourceType:'conversation',sourceRecordKey:'qa-confirmed'};
const stat={主角:{姓名:'林晓',种族:'人类',职业:'画师',生命值:{当前:100,上限:100},状态效果:{},金钱:250}};
const changes=[{op:'set',section:'外貌详述',field:'妆容',value:'淡红唇色，细眼线。自然五官不变。',evidence:'她化好淡红唇妆和细眼线，换上了蓝色外套。'},{op:'set',section:'当前穿着',field:'上衣',value:'蓝色外套',evidence:'她化好淡红唇妆和细眼线，换上了蓝色外套。'}];
const callbacks={};
const eventTypes=Object.fromEntries(['CHAT_CHANGED','MESSAGE_RECEIVED','MESSAGE_EDITED','MESSAGE_SWIPED','MESSAGE_DELETED','GENERATION_STARTED','GENERATION_AFTER_COMMANDS'].map(x=>[x,x]));
globalThis.qaContext={chatId:'qa-only',chat:[{is_user:false,send_date:'qa-1',mes:'<gametxt>她化好淡红唇妆和细眼线，换上了蓝色外套。</gametxt><LegacyBodyUpdate>'+JSON.stringify({version:1,bodyId:dossierBodyId(body),changes})+'</LegacyBodyUpdate>',stat_data:stat},{is_user:true,mes:'继续散步'}],chatMetadata:{legacy_life_manager:{version:13,protocolVersion:'dusk.1',currentBody:body,lives:[],backups:[]}},extensionSettings:{},extensionPrompts:{},eventTypes,eventSource:{on(type,callback){(callbacks[type]??=[]).push(callback);}},async setExtensionPrompt(key,value){this.extensionPrompts[key]={value};},saveMetadataDebounced(){},saveSettingsDebounced(){},getWorldInfoNames(){return [];}};
globalThis.SillyTavern={getContext:()=>qaContext};
globalThis.getVariables=()=>({stat_data:stat});
globalThis.toastr={info:console.log,warning:console.warn,error:console.error,success:console.log};
const repairMode=new URLSearchParams(location.search).has('repair');
const openingMode=new URLSearchParams(location.search).has('opening');
if(openingMode){
    qaContext.chat=[{mes:'<customized>自定义开局开始</customized>'},{is_user:true,mes:`【剧情生成上下文】
姓名: 林晓
年龄: 28岁
【初始开局剧情】
【自定义开局】
描述: # 林晓的开局资料
## 一、人物小传
出生于河畔小城，成年后学习绘画。
# 二、基础资料
姓名：林晓
种族：人类
# 三、外貌细节
妆容：无
头发：黑色长发
# 四、技能与魔法
## 风景画
善于描绘河流与山林。
# 五、人际关系
## 画店老板
长期合作的朋友。`},{mes:'<gametxt>她站在画店门前。</gametxt>',stat_data:stat}];
    delete qaContext.chatMetadata.legacy_life_manager;
}
if(repairMode){
    const mixed=[changes[0],{...changes[1],evidence:'她穿着蓝衣出门了，但原文并非这样写。'}];
    qaContext.chat[0].mes='她化好**淡红唇妆**和细眼线，换上了蓝色外套。<details><summary>本轮人物更新</summary><LegacyBodyUpdate>'+JSON.stringify({version:1,bodyId:dossierBodyId(body),changes:mixed})+'</LegacyBodyUpdate></details>';
}
await import('/index.js');
if(openingMode){
    await globalThis.legacyLifeManagerGenerationInterceptor([],50000,()=>{},'normal');
    const receipt=document.createElement('pre');receipt.id='qa-receipt';
    const b=qaContext.chatMetadata.legacy_life_manager.currentBody;
    receipt.textContent=`开局来源：${b.sourceType}\n板块数量：${b.sections.length}\n完整动态档案已写入提示：${qaContext.extensionPrompts.legacy_life_manager_current_body.value.includes(b.dynamicDossier.text)}\n原档保留：${b.rawCard.includes('妆容：无')}`;
    document.body.prepend(receipt);
}
if(repairMode){
    const controls=document.createElement('aside');
    const output=document.createElement('pre');output.id='qa-receipt';
    const add=(label,changes)=>{
        const button=document.createElement('button');button.textContent=label;
        button.onclick=async()=>{
            qaContext.chat.push({send_date:`qa-${qaContext.chat.length}`,mes:'<gametxt>她停在路边。</gametxt><LegacyBodyUpdate>'+JSON.stringify({version:1,bodyId:dossierBodyId(body),changes})+'</LegacyBodyUpdate>'});
            for(const cb of callbacks.MESSAGE_RECEIVED||[])await cb(qaContext.chat.length-1);
            await globalThis.legacyLifeManagerGenerationInterceptor([],50000,()=>{},'normal');
            const state=qaContext.chatMetadata.legacy_life_manager.currentBody.dynamicDossier;
            const prompt=qaContext.extensionPrompts.legacy_life_manager_current_body.value;
            output.textContent=`待补齐：${state.repairs.length}\n主档与提示一致：${prompt.includes(state.text)}\n${state.text}`;
        };
        controls.append(button);
    };
    add('模拟无关空回执',[]);add('模拟正确补齐',[changes[1]]);
    controls.append(output);document.body.prepend(controls);
}
</script></html>
